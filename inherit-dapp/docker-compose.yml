version: '3.8'

services:
  # === Database ===
  postgres:
    image: postgres:16-alpine
    container_name: legacy-postgres
    environment:
      POSTGRES_USER: legacy
      POSTGRES_PASSWORD: legacy_password
      POSTGRES_DB: legacy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacy -d legacy_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === IPFS Node ===
  ipfs:
    image: ipfs/kubo:latest
    container_name: legacy-ipfs
    ports:
      - "4001:4001"   # Swarm
      - "5001:5001"   # API
      - "8080:8080"   # Gateway
    volumes:
      - ipfs_data:/data/ipfs

  # === Chain Node ===
  chain:
    build:
      context: ./chain
      dockerfile: Dockerfile
    container_name: legacy-chain
    ports:
      - "26657:26657"  # Tendermint RPC
      - "1317:1317"    # REST API
      - "9090:9090"    # gRPC
    command: ["serve"]
    depends_on:
      - postgres

  # === Backend API ===
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legacy-backend
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SERVER_HOST: "0.0.0.0"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: legacy
      DB_PASSWORD: legacy_password
      DB_NAME: legacy_db
      DB_SSL_MODE: disable
      CHAIN_RPC_ENDPOINT: http://chain:26657
      CHAIN_GRPC_ENDPOINT: chain:9090
      CHAIN_ID: legacy-testnet-1
      IPFS_API_ENDPOINT: http://ipfs:5001/api/v0
      MONITOR_ENABLED: "true"
      HEARTBEAT_CHECK_INTERVAL: "60"
    depends_on:
      postgres:
        condition: service_healthy
      chain:
        condition: service_started

  # === Frontend ===
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legacy-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  ipfs_data:
